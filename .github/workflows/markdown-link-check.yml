name: Markdown link check

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/markdown-link-check.yml'
      - '.lycheeignore'
  push:
    branches: [master]
    paths:
      - '**/*.md'
      - '.lycheeignore'

jobs:
  lychee:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Lychee link checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --verbose --accept 200,201,202,203,204,206,300,301,302,303,304,307,308,403,429 './**/*.md'
          format: json
          output: ./lychee-report.json
          fail: false
      - name: Print failing links
        if: always()
        run: |
          if [ ! -f ./lychee-report.json ]; then
            echo "no report produced"; exit 1
          fi
          echo "=== lychee summary ==="
          jq '{total, successful, failures: (.error_map | to_entries | map({file: .key, errors: (.value | map({url, status}))}))}' ./lychee-report.json
          fail_count=$(jq '[.error_map[]?[]?] | length' ./lychee-report.json)
          echo "Total failing URLs: $fail_count"
          if [ "$fail_count" -gt 0 ]; then exit 1; fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: ./lychee-report.json
